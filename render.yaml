services:
  - type: web
    name: ai-flutter-builder
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: flutter-build-runner
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    plan: starter
    envVars:
      - key: BUILD_RUNNER_SECRET
        generateValue: true
