services:
  - type: web
    name: ai-flutter-builder-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: ai-flutter-builder
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_AI_API_URL
        value: https://ai-flutter-builder-api.onrender.com

  - type: web
    name: flutter-build-runner
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    plan: starter
    envVars:
      - key: BUILD_RUNNER_SECRET
        generateValue: true
